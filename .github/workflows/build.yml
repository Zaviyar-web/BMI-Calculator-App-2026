name: Build BMI Calculator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q BMI_Calculator_Play_Store_Ready_Project.zip -d project

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build Android App Bundle
        working-directory: project/BMICalculator
        run: gradle bundleRelease --no-daemon

      - name: Save AAB
        uses: actions/upload-artifact@v4
        with:
          name: BMI-Calculator-AAB
          path: project/BMICalculator/app/build/outputs/bundle/release/*.aab
