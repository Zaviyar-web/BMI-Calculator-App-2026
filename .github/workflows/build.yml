name: Build BMI Calculator

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q BMI_Calculator_Play_Store_Ready_Project.zip -d project

      - name: Fix Compose dependencies
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("project/app/build.gradle.kts")
          s = p.read_text()

          s = s.replace(
              'dependencies {',
              '''dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.02.00"))'''
          )

          p.write_text(s)
          print(p.read_text())
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11'

      - name: Build Release AAB
        working-directory: project
        run: gradle bundleRelease --no-daemon

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: BMI-Calculator-AAB
          path: project/app/build/outputs/bundle/release/*.aab
